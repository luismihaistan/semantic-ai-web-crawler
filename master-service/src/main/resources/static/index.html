<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Crawler & Semantic Search</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1115;
            color: #e4e6eb;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 780px; margin: 0 auto; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        .subtitle { color: #9098a4; margin-bottom: 32px; font-size: 14px; }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            border-bottom: 1px solid #2a2d35;
        }
        .tab {
            padding: 10px 18px;
            cursor: pointer;
            color: #9098a4;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
        }
        .tab:hover { color: #e4e6eb; }
        .tab.active { color: #6c8eff; border-bottom-color: #6c8eff; }

        .panel { display: none; }
        .panel.active { display: block; }

        .field { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: #9098a4; margin-bottom: 6px; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 11px 14px;
            background: #1a1d24;
            border: 1px solid #2a2d35;
            border-radius: 8px;
            color: #e4e6eb;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus { border-color: #6c8eff; }

        button {
            background: #6c8eff;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: #5a7ce8; }
        button:disabled { background: #3a3d45; cursor: not-allowed; }

        .row { display: flex; gap: 12px; align-items: flex-end; }
        .row .field { flex: 1; margin-bottom: 0; }

        .status-card {
            margin-top: 20px;
            padding: 16px;
            background: #1a1d24;
            border-radius: 8px;
            border: 1px solid #2a2d35;
            display: none;
        }
        .status-card.visible { display: block; }
        .status-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
        .status-row:last-child { margin-bottom: 0; }
        .status-label { color: #9098a4; }
        .badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.PENDING, .badge.RUNNING { background: #3a3416; color: #e8c547; }
        .badge.COMPLETED { background: #16351f; color: #4ade80; }
        .badge.FAILED { background: #3a1616; color: #f87171; }

        .progress-bar {
            margin-top: 12px;
            height: 6px;
            background: #2a2d35;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #6c8eff;
            transition: width 0.3s ease;
        }

        .result-card {
            margin-top: 14px;
            padding: 16px;
            background: #1a1d24;
            border-radius: 8px;
            border: 1px solid #2a2d35;
        }
        .result-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .result-title a { color: #6c8eff; text-decoration: none; }
        .result-title a:hover { text-decoration: underline; }
        .result-score { font-size: 12px; color: #6c8eff; margin-bottom: 8px; }
        .result-snippet { font-size: 13px; color: #b0b4bd; line-height: 1.5; margin-bottom: 8px; }
        .result-summary {
            font-size: 13px; color: #d0d3d9; line-height: 1.5;
            padding-top: 8px; border-top: 1px solid #2a2d35;
        }
        .result-summary strong { color: #9098a4; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }

        .answer-box {
            margin-top: 20px;
            padding: 18px;
            background: #1a1d24;
            border-radius: 8px;
            border: 1px solid #2a2d35;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            display: none;
        }
        .answer-box.visible { display: block; }

        .sources-list { margin-top: 16px; }
        .source-chip {
            display: inline-block;
            padding: 4px 10px;
            background: #22252c;
            border: 1px solid #2a2d35;
            border-radius: 6px;
            font-size: 12px;
            color: #9098a4;
            margin: 4px 6px 0 0;
        }

        .loading { color: #9098a4; font-size: 13px; margin-top: 16px; }
        .error { color: #f87171; font-size: 13px; margin-top: 16px; }
        .empty { color: #6a6e78; font-size: 13px; margin-top: 16px; text-align: center; padding: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Web Crawler & Semantic Search</h1>
    <p class="subtitle">Crawl a site, then search or ask questions about what it found.</p>

    <div class="tabs">
        <div class="tab active" data-tab="crawl">Crawl</div>
        <div class="tab" data-tab="search">Search</div>
        <div class="tab" data-tab="ask">Ask</div>
    </div>

    <!-- CRAWL PANEL -->
    <div class="panel active" id="panel-crawl">
        <div class="field">
            <label>URL to crawl</label>
            <input type="text" id="crawl-url" placeholder="https://example.com/page">
        </div>
        <div class="row">
            <div class="field">
                <label>Max pages</label>
                <input type="number" id="crawl-maxpages" value="10" min="1" max="200">
            </div>
            <button id="crawl-submit">Start Crawl</button>
        </div>

        <div class="status-card" id="crawl-status">
            <div class="status-row">
                <span class="status-label">Status</span>
                <span class="badge" id="status-badge">-</span>
            </div>
            <div class="status-row">
                <span class="status-label">Pages crawled</span>
                <span id="status-pages">0</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        </div>
        <div id="crawl-message"></div>
    </div>

    <!-- SEARCH PANEL -->
    <div class="panel" id="panel-search">
        <div class="row">
            <div class="field">
                <label>Search query</label>
                <input type="text" id="search-query" placeholder="e.g. object-oriented programming">
            </div>
            <button id="search-submit">Search</button>
        </div>
        <div id="search-results"></div>
    </div>

    <!-- ASK PANEL -->
    <div class="panel" id="panel-ask">
        <div class="row">
            <div class="field">
                <label>Ask a question</label>
                <input type="text" id="ask-question" placeholder="e.g. What's the difference between Java and ALGOL?">
            </div>
            <button id="ask-submit">Ask</button>
        </div>
        <div class="answer-box" id="answer-box"></div>
        <div class="sources-list" id="ask-sources"></div>
        <div id="ask-message"></div>
    </div>
</div>

<script>
    const API_BASE = '';

    // --- Tab switching ---
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        });
    });

    // --- CRAWL ---
    let pollTimer = null;

    document.getElementById('crawl-submit').addEventListener('click', async () => {
        const url = document.getElementById('crawl-url').value.trim();
        const maxPages = parseInt(document.getElementById('crawl-maxpages').value, 10) || 10;
        const messageEl = document.getElementById('crawl-message');
        const button = document.getElementById('crawl-submit');
        messageEl.textContent = '';

        if (!url) {
            messageEl.innerHTML = '<div class="error">Please enter a URL.</div>';
            return;
        }

        button.disabled = true;
        button.textContent = 'Starting...';

        try {
            const res = await fetch(`${API_BASE}/crawl`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, maxPages })
            });

            if (!res.ok) throw new Error(`Server returned ${res.status}`);
            const job = await res.json();

            document.getElementById('crawl-status').classList.add('visible');
            if (pollTimer) clearInterval(pollTimer);
            pollJobStatus(job.jobId, maxPages);

        } catch (err) {
            messageEl.innerHTML = `<div class="error">Failed to start crawl: ${err.message}</div>`;
        } finally {
            button.disabled = false;
            button.textContent = 'Start Crawl';
        }
    });

    function pollJobStatus(jobId, maxPages) {
        pollTimer = setInterval(async () => {
            try {
                const res = await fetch(`${API_BASE}/jobs/${jobId}`);
                if (!res.ok) throw new Error(`Server returned ${res.status}`);
                const job = await res.json();

                const status = job.status || 'PENDING';
                const pages = parseInt(job.pagesCrawled || 0, 10);
                const max = parseInt(job.maxPages || maxPages, 10);

                document.getElementById('status-badge').textContent = status;
                document.getElementById('status-badge').className = 'badge ' + status;
                document.getElementById('status-pages').textContent = `${pages} / ${max}`;
                document.getElementById('progress-fill').style.width = Math.min(100, (pages / max) * 100) + '%';

                if (status === 'COMPLETED' || status === 'FAILED') {
                    clearInterval(pollTimer);
                }
            } catch (err) {
                clearInterval(pollTimer);
                document.getElementById('crawl-message').innerHTML =
                    `<div class="error">Lost connection while checking job status: ${err.message}</div>`;
            }
        }, 1500);
    }

    // --- SEARCH ---
    document.getElementById('search-submit').addEventListener('click', runSearch);
    document.getElementById('search-query').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });

    async function runSearch() {
        const query = document.getElementById('search-query').value.trim();
        const resultsEl = document.getElementById('search-results');
        if (!query) return;

        resultsEl.innerHTML = '<div class="loading">Searching...</div>';

        try {
            const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
            if (!res.ok) throw new Error(`Server returned ${res.status}`);
            const results = await res.json();

            if (!results.length) {
                resultsEl.innerHTML = '<div class="empty">No results found.</div>';
                return;
            }

            resultsEl.innerHTML = results.map(r => `
            <div class="result-card">
                <div class="result-title"><a href="${r.url}" target="_blank">${escapeHtml(r.title || r.url)}</a></div>
                <div class="result-score">Relevance: ${(r.score * 100).toFixed(1)}%</div>
                <div class="result-snippet">${escapeHtml(r.snippet || '')}</div>
                ${r.summary ? `<div class="result-summary"><strong>Summary</strong><br>${escapeHtml(r.summary)}</div>` : ''}
            </div>
        `).join('');

        } catch (err) {
            resultsEl.innerHTML = `<div class="error">Search failed: ${err.message}</div>`;
        }
    }

    // --- ASK ---
    document.getElementById('ask-submit').addEventListener('click', runAsk);
    document.getElementById('ask-question').addEventListener('keydown', e => { if (e.key === 'Enter') runAsk(); });

    async function runAsk() {
        const question = document.getElementById('ask-question').value.trim();
        const answerBox = document.getElementById('answer-box');
        const sourcesEl = document.getElementById('ask-sources');
        const messageEl = document.getElementById('ask-message');
        const button = document.getElementById('ask-submit');

        if (!question) return;

        answerBox.classList.remove('visible');
        sourcesEl.innerHTML = '';
        messageEl.innerHTML = '<div class="loading">Thinking...</div>';
        button.disabled = true;

        try {
            const res = await fetch(`${API_BASE}/ask?q=${encodeURIComponent(question)}`);
            if (!res.ok) throw new Error(`Server returned ${res.status}`);
            const result = await res.json();

            messageEl.textContent = '';
            answerBox.textContent = result.answer;
            answerBox.classList.add('visible');

            if (result.sources && result.sources.length) {
                sourcesEl.innerHTML = result.sources.map(s =>
                    `<span class="source-chip">${escapeHtml(s.title || s.url)}</span>`
                ).join('');
            }

        } catch (err) {
            messageEl.innerHTML = `<div class="error">Failed to get an answer: ${err.message}</div>`;
        } finally {
            button.disabled = false;
        }
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
</script>
</body>
</html>
